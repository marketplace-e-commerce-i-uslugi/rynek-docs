<!doctype html><html lang="pl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FilterPanel</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"></head><body><!-- @dsCard group="Filtry" height=760 -->
<div id="root"><div style="padding:24px"><div style="width:300px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px">
<div class="row" style="justify-content:space-between"><div class="t-h3">Filtry</div><span class="t-cap" style="color:var(--brand);font-weight:700">Wyczyść</span></div><hr class="hr">
<div class="t-over">Cena</div><div class="row" style="margin:8px 0"><div class="r-input grow">100</div><span>–</span><div class="r-input grow">400</div></div>
<div class="t-over" style="margin-top:12px">Lokalizacja</div><div class="r-input" style="margin:8px 0"><i class="ic pin s20"></i>Warszawa · +30 km</div>
<div class="t-over" style="margin-top:12px">Stan</div><div class="row" style="min-height:44px"><span class="r-cb"></span><span class="grow">Nowy</span><span class="t-cap">112</span></div><div class="row" style="min-height:44px"><span class="r-cb on"></span><span class="grow">Używany</span><span class="t-cap">98</span></div><div class="row" style="min-height:44px"><span class="r-cb"></span><span class="grow">Uszkodzony</span><span class="t-cap">4</span></div>
<div class="t-over" style="margin-top:12px">Ocena sprzedawcy</div><div class="row" style="margin-top:8px"><span class="r-chip sel"><i class="ic star s14"></i> 4,5+</span><span class="r-chip out"><i class="ic star s14"></i> 4,0+</span></div>
<div class="row" style="margin-top:16px;min-height:44px"><span class="grow"><b>Tylko z filmem</b></span><span class="r-sw on"></span></div>
<span class="r-btn block" style="margin-top:16px">Pokaż 248 wyników</span></div></div></div>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:12px;bottom:12px;z-index:99;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:700 14px var(--font-sans);cursor:pointer">Jasny / ciemny</button></body></html>
